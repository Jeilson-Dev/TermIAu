[package]
name = "termiau-youtube"
version = "1.0.0"
edition = "2021"
description = "The YouTube Radio plugin's engine: serves the player page on 127.0.0.1 and looks up titles"

# A binary the plugin ships (see termiau.json `binaries`). The app runs it and
# speaks newline-delimited JSON with it over stdin/stdout (see src/main.rs).
[[bin]]
name = "termiau-youtube"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = "3.2"

[profile.release]
strip = true
