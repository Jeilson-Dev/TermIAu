<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The Radio plugin's icon: a radio with its antenna, and the footer's spectrum
       analyzer in the window, in the same purple-to-pink. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343746"/>
      <stop offset="1" stop-color="#21222c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bd93f9"/>
      <stop offset=".55" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <path d="M40 44 L84 22" stroke="#bd93f9" stroke-width="5" stroke-linecap="round"/>
  <circle cx="86" cy="21" r="5" fill="#ff79c6"/>
  <rect x="18" y="42" width="92" height="64" rx="12" fill="#bd93f9"/>
  <rect x="26" y="52" width="48" height="44" rx="6" fill="#191a21"/>
  <g fill="url(#bar)">
    <rect x="31" y="74" width="6" height="18" rx="1.5"/>
    <rect x="40" y="62" width="6" height="30" rx="1.5"/>
    <rect x="49" y="68" width="6" height="24" rx="1.5"/>
    <rect x="58" y="58" width="6" height="34" rx="1.5"/>
    <rect x="67" y="70" width="6" height="22" rx="1.5"/>
  </g>
  <circle cx="93" cy="64" r="9" fill="#191a21"/>
  <circle cx="93" cy="64" r="3.5" fill="#ff79c6"/>
  <rect x="84" y="82" width="18" height="5" rx="2.5" fill="#191a21"/>
  <rect x="84" y="91" width="18" height="5" rx="2.5" fill="#191a21"/>
</svg>
