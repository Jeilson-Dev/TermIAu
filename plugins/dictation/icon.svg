<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- The Dictation plugin's icon: a microphone with the footer's pink wave
       coming out of it, on the same dark tile as the Radio's. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343746"/>
      <stop offset="1" stop-color="#21222c"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff92d0"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="38" y="20" width="28" height="50" rx="14" fill="url(#mic)"/>
  <path d="M28 58 a24 24 0 0 0 48 0" fill="none" stroke="#bd93f9" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 82 V96 M40 98 H64" stroke="#bd93f9" stroke-width="5" stroke-linecap="round"/>
  <g fill="#ff79c6">
    <rect x="84" y="56" width="5" height="16" rx="2.5"/>
    <rect x="93" y="46" width="5" height="36" rx="2.5"/>
    <rect x="102" y="52" width="5" height="24" rx="2.5"/>
    <rect x="111" y="59" width="5" height="10" rx="2.5"/>
  </g>
</svg>
