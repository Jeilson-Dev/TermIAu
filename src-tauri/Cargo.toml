[package]
name = "termiau"
version = "0.1.0"
edition = "2021"

[lib]
name = "termiau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

# Transcrição local (o antigo Escuta). O whisper-rs compila o whisper.cpp com
# Metal — é o que faz a primeira build demorar.
anyhow = "1"
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
ureq = "3.2"

# O differ (a aba presa com o diff da branch). Ele fala com o `git` da linha de
# comando, então não entra biblioteca de git nenhuma; o store é o JSON que
# lembra a branch alvo de cada repositório e o que já foi revisado.
# `preserve_order`: o app reescreve o settings.json do Claude Code ao instalar os
# hooks, e sem isto as chaves do usuário voltariam em ordem alfabética.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-store = "2"
# Vigia do .git, para a aba do diff se refazer sozinha a cada commit.
notify = "8"

# Área de transferência (o ⌘⇧V). O Tauri não expõe os arquivos que estão na
# área, só texto — e o Finder não põe texto nenhum lá quando você copia um
# arquivo. Estas duas já vêm com o wry, então não custam build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3", features = ["NSURL"] }

# Os testes do differ montam repositórios git de verdade numa pasta temporária.
[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
