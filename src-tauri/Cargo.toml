[package]
name = "termiau"
version = "0.1.0"
edition = "2021"

[lib]
name = "termiau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
