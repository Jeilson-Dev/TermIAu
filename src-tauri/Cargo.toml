[package]
name = "termiau"
version = "0.1.0"
edition = "2021"

[lib]
name = "termiau_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

serde = { version = "1", features = ["derive"] }

# The differ (the pinned tab with the branch's diff). It talks to the command-line
# `git`, so no git library comes in; the store is the JSON that
# remembers each repository's target branch and what has already been reviewed.
# `preserve_order`: the app rewrites Claude Code's settings.json when installing the
# hooks, and without this the user's keys would come back in alphabetical order.
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-store = "2"
# Watcher for .git, so the diff tab redoes itself on every commit.
notify = "8"
# Plugin packages (.termiau) are zips (see plugins.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
# The marketplace checks each package against the catalog's sha256 (see marketplace.rs).
sha2 = "0.10"
# Verified plugins: Ed25519 signatures (see signing.rs). Already in the tree via rustls.
ring = "0.17"

# Clipboard (⌘⇧V) and the window's frame (janela.rs). Tauri doesn't expose the files on the clipboard,
# only text — and Finder puts no text there at all when you copy a
# file. These two already come with wry, so they cost no build time.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSWindow", "NSScreen", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSLocale", "NSArray", "NSString", "NSGeometry", "NSThread"] }

# The differ's tests build real git repositories in a temporary folder.
[dev-dependencies]
tempfile = "3"

# Plugin signatures hash every file of a plugin; unoptimized, that takes seconds in dev.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
strip = true
