[package]
name = "fala_nucleo"
description = "Motor de voz do Fala Cláudio: fonemas em português, Kokoro em ONNX e áudio, tudo nesta máquina."
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
# Tocar aqui dentro, e não por um `afplay`: é o que deixa mexer no volume no
# meio da frase. Mesma versão que a captura do microfone já usa.
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
espeak-rs-sys = { version = "0.2", default-features = false }
ort = "=2.0.0-rc.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
include_dir = "0.7"
libc = "0.2"
dirs = "5"
toml = "0.8"
ureq = "2"
sha2 = "0.10"
hex = "0.4"

[[test]]
name = "paridade"
path = "testes/paridade.rs"
