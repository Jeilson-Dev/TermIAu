<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>TermIAu</title>
  </head>
  <body>
    <!-- A barra só aparece com duas ou mais abas; com uma, é ruído. -->
    <div id="tabs" hidden>
      <!-- O "+" fica sempre no fim da fila por `order` no CSS, e não pela ordem
           aqui: os chips das abas entram por `appendChild` e passariam por cima
           dele. Faz o mesmo que ⌘T. -->
      <button id="nova-aba" class="tab-mais" title="Nova aba (⌘T)" aria-label="Nova aba">
        <!-- Desenhado, e não o caractere "+": o glifo se apoia na linha de base
             e fica alto dentro do botão. Dois traços num viewBox quadrado caem
             no centro de verdade. -->
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1.75v8.5M1.75 6h8.5" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div id="panes"></div>
    <!-- Faixa da voz: o espaço é reservado sempre. Aparecer e desaparecer
         faria os painéis encolherem e crescerem a cada ⌘E — o terminal
         inteiro pulava. Vazia ela é só uma linha escura no rodapé.
         As barrinhas da onda quem cria é o src/main.ts. -->
    <div id="voz">
      <!-- O uso do Claude (sessão e semana) no canto esquerdo: o hover abre os
           detalhes para a direita. Quem o monta é o src/main.ts. -->
      <div id="uso"></div>
      <span class="voz-onda" aria-hidden="true"></span>
      <span class="voz-texto"></span>
      <!-- A rádio fica na mesma faixa, encostada do outro lado: a escuta manda
           na esquerda (onda e parcial), a rádio na direita. Os botões, o volume
           e o iframe escondido quem cria é o src/main.ts. -->
      <div id="lofi"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
