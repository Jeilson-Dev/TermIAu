<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TermIAu</title>
  </head>
  <body>
    <!-- The bar only shows with two or more tabs; with one, it is noise. -->
    <div id="tabs" hidden>
      <!-- The "+" always stays at the end of the row through `order` in CSS, not
           through the order here: tab chips come in via `appendChild` and would
           go past it. It does the same as ⌘T. -->
      <button id="new-tab" class="tab-more" title="New tab (⌘T)" aria-label="New tab">
        <!-- Drawn, not the "+" character: the glyph rests on the baseline and
             sits high inside the button. Two strokes in a square viewBox land
             truly in the center. -->
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1.75v8.5M1.75 6h8.5" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div id="panes"></div>
    <!-- The footer: its space is always reserved. Appearing and disappearing
         would make the panels shrink and grow — the whole terminal jumped.
         Empty, it is just a dark line. -->
    <div id="status-bar">
      <!-- The plugins' footer slots in the left corner (the Claude usage plugin). -->
      <div id="status-bar-start"></div>
      <!-- Beside it, the progress of the long tasks Claude published with
           `termiau progress`, one pill per panel. src/main.ts builds it. -->
      <div id="progress"></div>
      <!-- More plugin slots: after the pills on the left and against the right end
           (the radio).
           src/plugins/host.ts fills all three. -->
      <div id="status-bar-left"></div>
      <div id="status-bar-plugins"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
