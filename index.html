<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TermIAu</title>
  </head>
  <body>
    <!-- The bar only shows with two or more tabs; with one, it is noise. -->
    <div id="tabs" hidden>
      <!-- The "+" always stays at the end of the row through `order` in CSS, not
           through the order here: tab chips come in via `appendChild` and would
           go past it. It does the same as ⌘T. -->
      <button id="nova-aba" class="tab-mais" title="New tab (⌘T)" aria-label="New tab">
        <!-- Drawn, not the "+" character: the glyph rests on the baseline and
             sits high inside the button. Two strokes in a square viewBox land
             truly in the center. -->
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M6 1.75v8.5M1.75 6h8.5" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
        </svg>
      </button>
    </div>
    <div id="panes"></div>
    <!-- Voice strip: its space is always reserved. Appearing and disappearing
         would make the panels shrink and grow on every ⌘E — the whole
         terminal jumped. Empty, it is just a dark line in the footer.
         src/main.ts creates the wave's little bars. -->
    <div id="voz">
      <!-- Claude's usage (session and week) in the left corner: hovering opens
           the details to the right. src/main.ts builds it. -->
      <div id="uso"></div>
      <span class="voz-onda" aria-hidden="true"></span>
      <span class="voz-texto"></span>
      <!-- The radio sits on the same strip, against the other side: dictation
           rules the left (wave and partial), the radio the right. src/main.ts
           creates the buttons, the volume and the hidden iframe. -->
      <div id="lofi"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
